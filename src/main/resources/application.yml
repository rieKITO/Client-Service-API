spring:
  application:
    name: ClientServiceAPI
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clients}
    username: ${DB_USERNAME:clients}
    password: ${DB_PASSWORD:clients}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
